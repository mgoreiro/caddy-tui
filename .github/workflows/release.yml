name: release
# Builds the .deb, attaches it to the GitHub release and publishes it to the signed apt repository
# (https://mgoreiro.github.io/caddy-tui/apt) when a release is published.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload to (e.g. v1.1.0)
        required: true

permissions:
  contents: write

# One at a time: every run rewrites the apt repository (gh-pages branch).
concurrency:
  group: apt-repository
  cancel-in-progress: false

jobs:
  deb:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Tag, __version__ and debian/changelog agree
        run: |
          v="${TAG#v}"
          code=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' caddy-tui.py)
          deb=$(dpkg-parsechangelog -S Version 2>/dev/null || sed -n '1s/^[^(]*(\([^)]*\)).*/\1/p' debian/changelog)
          echo "tag=$v code=$code changelog=$deb"
          [ "$v" = "$code" ] && [ "$v" = "$deb" ]
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential debhelper dh-python gettext python3 fakeroot lintian
      - name: Build
        run: dpkg-buildpackage -us -uc -b
      - name: Lint
        run: lintian --fail-on error ../caddy-tui_*_all.deb
      - name: Upload to the release
        run: |
          cd ..
          sha256sum caddy-tui_*_all.deb > SHA256SUMS
          gh release upload "$TAG" caddy-tui_*_all.deb SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/checkout@v4
        with:
          ref: main
          path: ci-tools
          sparse-checkout: tools
      - name: Publish to the apt repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "APT_GPG_PRIVATE_KEY is not set: skipping the apt repository"; exit 0
          fi
          sudo apt-get install -y apt-utils gnupg
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add ../apt-site -B gh-pages origin/gh-pages
          ci-tools/tools/update-apt-repo.sh ../apt-site/apt ../caddy-tui_*_all.deb
          cd ../apt-site
          git add -A
          if git diff --cached --quiet; then echo "nothing new to publish"; exit 0; fi
          git commit -m "caddy-tui $TAG"
          git push origin HEAD:gh-pages
